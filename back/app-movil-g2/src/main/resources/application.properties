# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/reserva?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=abc1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto de Hibernate para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración para la creación y actualización del esquema de base de datos
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL ejecutadas (útil para depuración)
spring.jpa.show-sql=true

# Configuración del puerto del servidor
server.port=8080
